name: Automatická aktualizace portálu (nové zápisy ZO, rozpočet, zakázky)

# Cíl: kontrola zhruba v 7:00 SEČ (v SELČ o hodinu později). GitHub plánované běhy
# spouští se zpožděním ~4–6 h (měřeno 10/2026), proto je cron posunutý dřív a mimo
# celou hodinu. Při změně uprav i texty v build_aktualizace.py. Lze spustit ručně.
# Push přes GITHUB_TOKEN nespouští jiné workflow, proto se při změně deploy.yml
# spouští ručně (workflow_dispatch) — celé nasazení včetně upozornění a dat MCP.

on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:

concurrency:
  group: update-ostopovice
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # git push
      issues: write     # upozornění na nová zasedání (→ e-mail)
      actions: write    # spuštění deploy.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Závislosti
        run: pip install --quiet requests beautifulsoup4 pdfplumber openpyxl

      - name: Aktualizace dat a stránek
        run: python scripts/update_portal.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Commit a push (pokud se něco změnilo)
        id: push
        run: |
          git config user.name  "portal-bot"
          git config user.email "portal-bot@users.noreply.github.com"
          # samotné datum v patičce není změna dat → necommitovat
          git add -A ':!.update_summary.md'
          if git diff --cached --quiet -- dataset_ZO.json data/; then
            echo "Data beze změny."
            git reset -q
            echo "new=false" >> $GITHUB_OUTPUT
          else
            git commit -q -m "Auto: aktualizace dat portálu"
            git push origin main
            echo "new=true" >> $GITHUB_OUTPUT
          fi

      - name: Spustit nasazení
        if: steps.push.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

      - name: Issue s přehledem nových zasedání
        if: hashFiles('.update_summary.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('.update_summary.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: '📋 Ostopovice: nové zasedání zastupitelstva',
              body: body + '\n\n---\n_Workflow: check_web.yml_',
            });
