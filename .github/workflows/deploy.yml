name: Deploy na Wedos (ostopovice.jaksemame.cz + ostopovice.jakzijistrelice.cz)

# Při pushi do main se statické HTML stránky portálu nahrají přes FTP na Wedos.
# Spustit lze i ručně (workflow_dispatch).
#
# Vyžaduje tajné hodnoty (Settings → Secrets and variables → Actions):
#   FTP_SERVER    – např. wfilesXX.wedos.net (stejný účet jako pro jakzijistrelice.cz)
#   FTP_USERNAME  – FTP login z Wedosu
#   FTP_PASSWORD  – FTP heslo z Wedosu
# a existující subdoménu ostopovice.jakzijistrelice.cz s docrootem /www/subdom/ostopovice/

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-ostopovice
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}   # rozesílání upozornění (push/send.php); bez něj se nerozesílají
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sestavit složku k nasazení (portálové HTML)
        run: |
          mkdir -p public
          # všechny portálové stránky v kořeni kromě dočasných "_*.html"
          # (Chart.js i favikona jsou vložené přímo v HTML; navíc jen sdílecí og-image.png)
          find . -maxdepth 1 -name '*.html' ! -name '_*' -exec cp {} public/ \;
          cp og-image.png public/ 2>/dev/null || true
          # písma značky (stránky je načítají relativně z fonts/) + favikony a manifest do kořene
          cp -r fonts public/
          cp brand/favicon/* public/
          # upozornění (Web Push): seznam položek k oznámení, PHP backend a service worker
          python3 build_push.py
          cp -r push public/push
          cp sw.js public/
          echo "Nasazované soubory:"
          ls -la public/ public/push

      - name: Token pro rozesílání upozornění
        # bez secretu PUSH_TOKEN se upozornění nerozesílají, nasazení ale proběhne
        if: env.PUSH_TOKEN != ''
        run: |
          python3 - <<'PY'
          import os
          t = os.environ["PUSH_TOKEN"]
          assert len(t) >= 20, "PUSH_TOKEN je kratší než 20 znaků"
          php = "<?php" + chr(10) + "return ['token' => %r];" % t + chr(10)
          open("public/push/config.local.php", "w").write(php)
          PY

      - name: Deploy přes FTP na Wedos
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps                     # když FTPS nepojede, zkus "ftp"
          port: 21
          server-dir: /www/subdom/ostopovice/   # docroot subdomény ostopovice — slouží pro ostopovice.jaksemame.cz i ostopovice.jakzijistrelice.cz
          local-dir: ./public/
          # pozn.: akce dělá inkrementální sync; docroot subdomény vyhraď JEN tomuto webu.
          # push/data/ (SQLite s odběrateli) vytváří PHP na serveru — sync ho nezná, takže ho nemaže.

      # Data pro MCP server jaksemame.cz/mcp (kód serveru nasazuje repo Střelic s rozcestníkem).
      # Vlastní složka jen s naším souborem: sync nesmaže data Střelic ve stejné složce.
      - name: Sestavit data pro MCP server
        run: |
          python3 build_mcp.py
          mkdir -p public_mcp
          cp mcp/ostopovice.sqlite public_mcp/

      - name: Deploy dat MCP (jaksemame.cz/mcp/data)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /www/domains/jaksemame.cz/mcp/data/
          local-dir: ./public_mcp/

      - name: Rozeslání upozornění na nová zasedání
        if: env.PUSH_TOKEN != ''
        # web je nasazený i tehdy, když rozeslání selže; chyba je vidět v záznamu
        continue-on-error: true
        run: |
          curl -fsS --max-time 300 -X POST --data "" -H "Authorization: Bearer $PUSH_TOKEN" https://ostopovice.jaksemame.cz/push/send.php
          echo
